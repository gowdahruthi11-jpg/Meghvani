    publication_date: "2023-05"
    source_url_or_reference: "https://www.pdkv.ac.in/"
    page_or_section: "Section 3: Contingency Sowing under Delayed Rainfall"
    source_name: "Dr. PDKV Akola"
    source_reference: "Pigeonpea (Tur) Contingency Guidelines for Vidarbha"
    source_date: "2023-05"
    validation_status: "VALIDATED"
    validation_notes: "Verified against Dr. PDKV Akola Vidarbha contingency recommendations."
    reviewed_at: "2026-10-02"
    source_supported_conditions:
      - "Hold pigeonpea sowing until adequate profile moisture (minimum 75-100 mm cumulative rainfall) is achieved across the root zone."
    meghvani_decision_conditions:
      - "The rule is eligible when the prototype decision engine returns WAIT."
      - "Current prototype WAIT threshold uses false-onset probability >= 0.60."
    source_vs_model_boundary: "The requirement to hold sowing until 75-100 mm profile moisture is established is institutional agronomic guidance from Dr. PDKV Akola. The false-onset probability threshold (>=0.60) is a Meghvani prototype parameter and is not an institutional agronomic threshold."
    language: "en"
    priority: "HIGH"

  # =========================================================================
  # 4. CANDIDATE CONTINGENCY RULES (REVIEW_REQUIRED)
  # =========================================================================
  - rule_id: "RULE_REVIEW_MH_SOYBEAN_SOW_PART_NOW"
    crop_id: "soybean"
    geography: "Maharashtra"
    decision: "SOW_PART_NOW"
    trigger_condition: "Marginal seedbed moisture with erratic onset where Meghvani prototype decision is SOW_PART_NOW."
    action: "PARTIAL_OR_INTERCROPPING"
    action_type: "PARTIAL_OR_INTERCROPPING"
    advisory_text: "Adopt partial sowing or intercropping posture. Sow Soybean + Pigeonpea in 4:2 or 3:1 row proportion to minimize risk under erratic monsoon onset."
    rationale: "Intercropping soybean with deep-rooted pigeonpea provides biological insurance against erratic rainfall."
    reason: "Intercropping soybean with deep-rooted pigeonpea provides biological insurance against erratic rainfall."
    source_institution: "ICAR-Central Research Institute for Dryland Agriculture (CRIDA)"
    source_title: "District Agriculture Contingency Plan for District: Nagpur, Maharashtra"
