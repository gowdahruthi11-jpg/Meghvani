# AGRONOMIC ADVISORY RULES (PHASE 5B SOURCED REGISTRY & PHASE 5B.1 PROVENANCE SEPARATION)
# Initial Target Geography: Maharashtra (Vidarbha Zone: Nagpur, Wardha, Amravati, Akola)
# Initial Target Crops: Soybean, Cotton, Pigeonpea (Tur)
#
# VALIDATION STATUS CRITERIA:
# - VALIDATED: Source institution, document title, document ID, reference URL, and section are fully verified.
#              Only VALIDATED rules may be returned by the operational advisory engine.
# - REVIEW_REQUIRED: Sourced recommendation requiring localized agronomist / SAU sign-off before operational use.
# - UNVALIDATED: Demonstration or placeholder rules without verified institutional backing. Never used for advice.
#
# PROVENANCE BOUNDARY (PHASE 5B.1):
# Institutional sources support agronomic soil, rainfall, seedbed, and cultural practices.
# Probability thresholds (<0.30, >=0.60) are Meghvani prototype decision-engine parameters and
# must NOT be attributed to ICAR, CICR, PDKV, or the Maharashtra Department of Agriculture.

agronomic_rules:
  # =========================================================================
  # 1. SOYBEAN (Glycine max) - MAHARASHTRA / VIDARBHA ZONE
  # =========================================================================
  - rule_id: "RULE_CRIDA_MH_SOYBEAN_SOW_NOW"
    crop_id: "soybean"
    geography: "Maharashtra"
    decision: "SOW_NOW"
    trigger_condition: "Cumulative rainfall reaches 75-100 mm / adequate seedbed moisture according to cited source, and Meghvani prototype decision is SOW_NOW."
    action: "FULL_SOWING"
    action_type: "FULL_SOWING"
    advisory_text: "Proceed with soybean sowing using certified, fungicide-treated seed. Adopt Broad Bed Furrow (BBF) or ridge-and-furrow system to ensure drainage during heavy downpours and retain in-situ root zone moisture."
    rationale: "Adequate 75-100 mm seedbed moisture ensures rapid germination and seedling establishment, while BBF configuration buffers against mid-season waterlogging or dry spells."
    reason: "Adequate 75-100 mm seedbed moisture ensures rapid germination and seedling establishment, while BBF configuration buffers against mid-season waterlogging or dry spells."
    source_institution: "ICAR-Central Research Institute for Dryland Agriculture (CRIDA)"
    source_title: "District Agriculture Contingency Plan for District: Nagpur, Maharashtra"
    source_document_identifier: "CRIDA-DACP-MH-NAGPUR-2020"
    source_version: "2020.1"
    publication_date: "2020-07"
    source_url_or_reference: "http://agricoop.nic.in/sites/default/files/MH18-%20Nagpur.pdf"
    page_or_section: "Section 2.1: Major rainfed farming situation - Sowing of Kharif Soybean"
    source_name: "ICAR-CRIDA"
    source_reference: "District Agriculture Contingency Plan for District: Nagpur, Maharashtra (Section 2.1)"
    source_date: "2020-07"
    validation_status: "VALIDATED"
    validation_notes: "Verified against ICAR-CRIDA Nagpur DACP in collaboration with NBSS&LUP and Dept of Agriculture, Maharashtra."
    reviewed_at: "2026-10-02"
    source_supported_conditions:
      - "Sowing after receipt of 75-100 mm rainfall / adequate seedbed moisture, where supported by the cited source."
      - "Adoption of Broad Bed Furrow (BBF) or ridge-and-furrow system to ensure drainage and retain root zone moisture."
    meghvani_decision_conditions:
      - "The rule is eligible when the Meghvani prototype decision engine returns SOW_NOW."
      - "Current prototype SOW_NOW threshold uses false-onset probability < 0.30."
    source_vs_model_boundary: "The rainfall and seedbed moisture condition (75-100 mm) is source-derived from ICAR-CRIDA. The false-onset probability threshold (<0.30) is a Meghvani prototype parameter and is not an institutional agronomic threshold."
    language: "en"
    priority: "NORMAL"

  - rule_id: "RULE_MAHA_AGRI_SOYBEAN_WAIT"
    crop_id: "soybean"
    geography: "Maharashtra"
    decision: "WAIT"
    trigger_condition: "Monsoon rainfall below 75-100 mm or erratic early showers where Meghvani prototype decision is WAIT."
    action: "DELAY_SOWING"
    action_type: "DELAY_SOWING"
    advisory_text: "Defer soybean sowing until the region receives a minimum of 75 to 100 mm cumulative rainfall. Do not sow under isolated pre-monsoon showers to prevent seed rotting or seedling mortality."
    rationale: "Sowing under insufficient moisture followed by dry spells causes germination failure and necessitates costly re-sowing."
    reason: "Sowing under insufficient moisture followed by dry spells causes germination failure and necessitates costly re-sowing."
    source_institution: "Department of Agriculture, Government of Maharashtra"
    source_title: "Advisory Guidelines for Kharif Sowing in Vidarbha and Marathwada"
    source_document_identifier: "MAHA-AGRI-KHARIF-ADV-2023"
    source_version: "2023.2"
    publication_date: "2023-06"
    source_url_or_reference: "https://krishi.maharashtra.gov.in/"
    page_or_section: "Section 1: Soil Moisture Preparedness and Sowing Thresholds"
    source_name: "Department of Agriculture, Government of Maharashtra"
    source_reference: "Advisory Guidelines for Kharif Sowing in Vidarbha and Marathwada (Section 1)"
    source_date: "2023-06"
    validation_status: "VALIDATED"
    validation_notes: "Verified against Maharashtra State Dept of Agriculture guidelines and Dr. PDKV Akola advisories."
    reviewed_at: "2026-10-02"
    source_supported_conditions:
      - "Delay sowing until adequate rainfall (minimum 75-100 mm cumulative) and seedbed moisture conditions are achieved."
      - "Avoid sowing under isolated pre-monsoon showers without sustained moisture."
    meghvani_decision_conditions:
      - "The rule is eligible when the prototype decision engine returns WAIT."
      - "Current prototype WAIT threshold uses false-onset probability >= 0.60."
    source_vs_model_boundary: "The guidance to defer sowing until 75-100 mm rainfall is received is derived from Maharashtra State Department of Agriculture. The false-onset probability threshold (>=0.60) is a Meghvani prototype parameter and is not an institutional agronomic threshold."
    language: "en"
    priority: "HIGH"

  # =========================================================================
  # 2. COTTON (Gossypium hirsutum) - MAHARASHTRA / VIDARBHA ZONE
  # =========================================================================
  - rule_id: "RULE_CICR_MH_COTTON_SOW_NOW"
    crop_id: "cotton"
    geography: "Maharashtra"
    decision: "SOW_NOW"
    trigger_condition: "Cumulative rainfall reaches 75-100 mm soaking precipitation according to cited source, and Meghvani prototype decision is SOW_NOW."
    action: "FULL_SOWING"
    action_type: "FULL_SOWING"
    advisory_text: "Initiate cotton sowing in well-prepared seedbed after receiving 75-100 mm soaking rainfall. Open conservation furrows after every two rows for in-situ moisture conservation."
    rationale: "Adequate soil moisture guarantees uniform cotton seedling emergence and early root penetration in deep black soils."
    reason: "Adequate soil moisture guarantees uniform cotton seedling emergence and early root penetration in deep black soils."
    source_institution: "ICAR-Central Institute for Cotton Research (CICR), Nagpur"
    source_title: "Cotton Crop Advisory & Contingency Strategies for Rainfed Vidarbha"
    source_document_identifier: "ICAR-CICR-TECH-VID-2022"
    source_version: "2022.1"
    publication_date: "2022-05"
    source_url_or_reference: "https://cicr.icar.gov.in/"
    page_or_section: "Chapter 3: Rainfed Cotton Agro-Techniques"
    source_name: "ICAR-CICR Nagpur"
    source_reference: "Cotton Crop Advisory & Contingency Strategies for Rainfed Vidarbha (Chapter 3)"
    source_date: "2022-05"
    validation_status: "VALIDATED"
    validation_notes: "Verified from ICAR-CICR Nagpur rainfed cotton agro-techniques."
    reviewed_at: "2026-10-02"
    source_supported_conditions:
      - "Initiate cotton sowing in well-prepared seedbed after receiving 75-100 mm soaking rainfall."
      - "Open conservation furrows after every two rows for in-situ moisture conservation."
    meghvani_decision_conditions:
      - "The rule is eligible when the Meghvani prototype decision engine returns SOW_NOW."
      - "Current prototype SOW_NOW threshold uses false-onset probability < 0.30."
    source_vs_model_boundary: "The 75-100 mm soaking rainfall requirement and furrow conservation are institutional agronomic guidance from ICAR-CICR Nagpur. The false-onset probability threshold (<0.30) is a Meghvani prototype parameter and is not an institutional agronomic threshold."
    language: "en"
    priority: "NORMAL"

  - rule_id: "RULE_CICR_MH_COTTON_WAIT"
    crop_id: "cotton"
    geography: "Maharashtra"
    decision: "WAIT"
    trigger_condition: "Rainfall below 75 mm or post-onset dry spell risk where Meghvani prototype decision is WAIT."
    action: "DELAY_SOWING"
    action_type: "DELAY_SOWING"
    advisory_text: "Delay cotton sowing until sustained monsoon rains arrive. Strictly avoid dry sowing (Dhul-Vapasa) in light-to-medium soils without guaranteed irrigation to prevent poor stand establishment."
    rationale: "Early sowing in unsoaked soils risks seed desiccation and high seedling mortality during post-onset dry spells."
    reason: "Early sowing in unsoaked soils risks seed desiccation and high seedling mortality during post-onset dry spells."
    source_institution: "ICAR-Central Institute for Cotton Research (CICR), Nagpur"
    source_title: "Cotton Crop Advisory & Contingency Strategies for Rainfed Vidarbha"
    source_document_identifier: "ICAR-CICR-TECH-VID-2022"
    source_version: "2022.1"
    publication_date: "2022-05"
    source_url_or_reference: "https://cicr.icar.gov.in/"
    page_or_section: "Chapter 4: Contingency Management for Delayed/Erratic Monsoon"
    source_name: "ICAR-CICR Nagpur"
    source_reference: "Cotton Crop Advisory & Contingency Strategies for Rainfed Vidarbha (Chapter 4)"
    source_date: "2022-05"
    validation_status: "VALIDATED"
    validation_notes: "Verified from ICAR-CICR Nagpur technical contingency bulletin."
    reviewed_at: "2026-10-02"
    source_supported_conditions:
      - "Delay cotton sowing until sustained monsoon rains arrive."
      - "Strictly avoid dry sowing (Dhul-Vapasa) in light-to-medium soils without guaranteed irrigation."
    meghvani_decision_conditions:
      - "The rule is eligible when the prototype decision engine returns WAIT."
      - "Current prototype WAIT threshold uses false-onset probability >= 0.60."
    source_vs_model_boundary: "The recommendation to defer sowing until sustained rains arrive and avoid un-irrigated dry sowing is institutional agronomic guidance from ICAR-CICR Nagpur. The false-onset probability threshold (>=0.60) is a Meghvani prototype parameter and is not an institutional agronomic threshold."
    language: "en"
    priority: "HIGH"

  # =========================================================================
  # 3. PIGEONPEA / TUR (Cajanus cajan) - MAHARASHTRA / VIDARBHA ZONE
  # =========================================================================
  - rule_id: "RULE_PDKV_MH_PIGEONPEA_SOW_NOW"
    crop_id: "pigeonpea"
    geography: "Maharashtra"
    decision: "SOW_NOW"
    trigger_condition: "Soaking rain of 75-100 mm received with adequate seedbed moisture according to cited source, and Meghvani prototype decision is SOW_NOW."
    action: "FULL_SOWING"
    action_type: "FULL_SOWING"
    advisory_text: "Proceed with pigeonpea sowing on ridges and furrows or BBF with recommended varieties (PKV Tara, BSMR-736, AKT-8811). Treat seed with Trichoderma and Rhizobium culture."
    rationale: "Ridge planting prevents waterlogging in heavy vertisols and promotes deep taproot development to withstand later dry periods."
    reason: "Ridge planting prevents waterlogging in heavy vertisols and promotes deep taproot development to withstand later dry periods."
    source_institution: "Dr. Panjabrao Deshmukh Krishi Vidyapeeth (Dr. PDKV), Akola"
    source_title: "Pigeonpea (Tur) Production Technology and Agro-Advisory for Vidarbha"
    source_document_identifier: "DR-PDKV-AGROMET-TUR-2023"
    source_version: "2023.1"
    publication_date: "2023-05"
    source_url_or_reference: "https://www.pdkv.ac.in/"
    page_or_section: "Package of Practices for Kharif Pulses - Pigeonpea"
    source_name: "Dr. PDKV Akola"
    source_reference: "Pigeonpea (Tur) Production Technology for Vidarbha"
    source_date: "2023-05"
    validation_status: "VALIDATED"
    validation_notes: "Verified against Dr. PDKV Akola university package of practices."
    reviewed_at: "2026-10-02"
    source_supported_conditions:
      - "Sow pigeonpea on ridges and furrows or BBF upon receipt of 75-100 mm soaking rain with recommended varieties."
      - "Treat seed with Trichoderma and Rhizobium culture prior to sowing."
    meghvani_decision_conditions:
      - "The rule is eligible when the Meghvani prototype decision engine returns SOW_NOW."
      - "Current prototype SOW_NOW threshold uses false-onset probability < 0.30."
    source_vs_model_boundary: "The 75-100 mm soaking rain, ridge planting, and seed treatment recommendations are institutional agronomic guidance from Dr. PDKV Akola. The false-onset probability threshold (<0.30) is a Meghvani prototype parameter and is not an institutional agronomic threshold."
    language: "en"
    priority: "NORMAL"

  - rule_id: "RULE_PDKV_MH_PIGEONPEA_WAIT"
    crop_id: "pigeonpea"
    geography: "Maharashtra"
    decision: "WAIT"
    trigger_condition: "Deficient root-zone moisture or prolonged dry spell risk where Meghvani prototype decision is WAIT."
    action: "DELAY_SOWING"
    action_type: "DELAY_SOWING"
    advisory_text: "Hold pigeonpea sowing until adequate profile moisture (minimum 75-100 mm cumulative rainfall) is achieved across the root zone."
    rationale: "Insufficient initial moisture causes patchy emergence and stunted root systems vulnerable to subsequent dry spells."
    reason: "Insufficient initial moisture causes patchy emergence and stunted root systems vulnerable to subsequent dry spells."
    source_institution: "Dr. Panjabrao Deshmukh Krishi Vidyapeeth (Dr. PDKV), Akola"
    source_title: "Pigeonpea (Tur) Production Technology and Agro-Advisory for Vidarbha"
