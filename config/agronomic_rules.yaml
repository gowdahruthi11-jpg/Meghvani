    source_reference: "District Agriculture Contingency Plan for District: Nagpur, Maharashtra (Section 2.1.1)"
    source_date: "2020-07"
    validation_status: "REVIEW_REQUIRED"
    validation_notes: "Awaiting local KVK agronomist confirmation for specific seedbed row configurations."
    reviewed_at: "2026-10-02"
    source_supported_conditions:
      - "Adopt intercropping system (Soybean + Pigeonpea in 4:2 or 3:1 row proportion) under erratic or delayed onset conditions."
    meghvani_decision_conditions:
      - "The rule is eligible when the Meghvani prototype decision engine returns SOW_PART_NOW."
      - "Current prototype SOW_PART_NOW threshold uses false-onset probability between 0.30 and 0.60."
    source_vs_model_boundary: "The intercropping recommendation is derived from ICAR-CRIDA contingency plans. The 0.30-0.60 false-onset probability threshold is a Meghvani prototype parameter and is not an institutional agronomic threshold."
    language: "en"
    priority: "NORMAL"

  - rule_id: "RULE_REVIEW_MH_COTTON_SOW_PART_NOW"
    crop_id: "cotton"
    geography: "Maharashtra"
    decision: "SOW_PART_NOW"
    trigger_condition: "Delayed onset conditions with patchy rainfall where Meghvani prototype decision is SOW_PART_NOW."
    action: "PARTIAL_OR_INTERCROPPING"
    action_type: "PARTIAL_OR_INTERCROPPING"
    advisory_text: "Adopt split sowing or intercrop Cotton with Pigeonpea (6:1 or 8:2 row ratio) to mitigate risk under delayed monsoon conditions."
    rationale: "Crop diversification provides biological insurance against rainfall aberrations during early vegetative growth."
    reason: "Crop diversification provides biological insurance against rainfall aberrations during early vegetative growth."
    source_institution: "ICAR-Central Institute for Cotton Research (CICR), Nagpur"
    source_title: "Cotton Crop Advisory & Contingency Strategies for Rainfed Vidarbha"
